[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spec-agents"
version = "0.12.0"
description = "Reusable agent + adapter primitives extracted from spectacular/spec_report"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.92.0",
    "requests>=2.32.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff==0.16.6",
    "pyright==1.1.411",  # pinned to match CI so a local `.[dev]` reproduces CI's
                         # type-check result exactly (stack-wide pin, review Open Q5).
]
# Interactive terminal UI (spec_agents.tui.render_textual / record_browser).
# OPTIONAL — kept out of the hard deps like keyring elsewhere; the kit imports
# textual lazily and falls back to a clear ImportError when it is absent.
textual = [
    "textual>=0.50.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spec_agents"]

[tool.pyright]
include = ["src"]
strict = []  # pyright wants an array of paths here, not a boolean. Empty
             # = no paths in strict mode (matches current default-mode behavior).
             # See planning/architecture-reviews/2026-05-28-autonomous-run-findings.md §1.
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# stack-tooling-1 (ruff 0.16.6): UP046/UP047 want PEP 695 type-parameter syntax on the
# kernel's generic helpers. The rewrite is mechanical but changes public signature text
# in a library consumers pin; deferred to a release-bearing sprint.
"src/spec_agents/agents/parallel.py" = ["UP046", "UP047"]
"src/spec_agents/caching.py" = ["UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]
