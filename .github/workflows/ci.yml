name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Opt in to Node 24 ahead of GitHub's 2026-06-02 forced switch.
# actions/checkout@v7 + actions/setup-python@v7 are Node-24 native
# (stack-tooling-1, 2026-09-10); the env var stays as a harmless belt-and-braces
# and the planning conformance check still looks for it.
# Documented at:
#   github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
# (ci-node-migration-01 / S1.E2 of dev-plan-30d-revision-01)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        # Consumers install spec-agents from the git URL pinned in their
        # pyproject.toml (XR-005). The kernel itself installs editable
        # from source. ruff/pyright/detect-secrets are pinned to match
        # what the .pre-commit-config.yaml uses, so CI and pre-commit
        # don't drift on formatting/type rules.
        # [textual] + keyring: pyright must resolve the optional tui/secrets imports
        # (lazy at runtime; both live in the local env). CI had been red on
        # reportMissingImports since v0.12.0 (2026-06-04) until stack-tooling-1 added them.
        run: pip install -e ".[dev,textual]" keyring "ruff==0.16.6" "pyright==1.1.411" "detect-secrets==1.5.0"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (pyright strict)
        run: pyright

      - name: Detect secrets (XR-001)
        run: |
          # Compare current scan against the committed baseline; exit non-zero
          # if any tracked file has a new high-entropy secret not in the baseline.
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Tests
        run: pytest -q
